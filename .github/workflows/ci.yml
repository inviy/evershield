name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Smoke-test the built CLI
        run: node dist/bin.js --version
      - name: evershield scans its own build output
        run: node dist/bin.js scan dist --format sarif --output evershield.sarif && node -e "JSON.parse(require('fs').readFileSync('evershield.sarif','utf8'))"
